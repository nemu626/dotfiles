# Shared defaults, also linked from ~/.config/mise/config.toml.
# Project-specific versions belong in each project's mise.toml.
[settings]
idiomatic_version_file_enable_tools = ["node"]

[tools]
glow = "latest"
go = "latest"
marp-cli = "latest"
ni = "latest"
node = "24.22.1"
"npm:nps" = "latest"
"npm:ntl" = "latest"
pnpm = "10.33.0"
rust = "latest"
taplo = "latest"
yarn = "v4"
uv = "latest"
bun = "latest"
"github:trasta298/keifu" = "latest"
opencode = "latest"
"npm:@openai/codex" = "latest"
"npm:live-server" = "latest"
"cargo:task-keeper" = "latest"
"github:kyu08/fzf-make" = "latest"
